[project]
name = "mangouse"
description = "Compositor-agnostic Wayland seat adapter for coding agents."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gianluca Mazza", email = "info@gianlucamazza.it" }]
keywords = ["wayland", "mcp", "computer-use", "seat"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.13",
  "Topic :: Desktop Environment",
]
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2"]

[project.scripts]
mangouse = "mangouse.hosts.cli:main"
mangouse-mcp = "mangouse.hosts.mcp:main"

[project.urls]
Homepage = "https://github.com/gianlucamazza/mangouse"
Repository = "https://github.com/gianlucamazza/mangouse"
Issues = "https://github.com/gianlucamazza/mangouse/issues"
Changelog = "https://github.com/gianlucamazza/mangouse/blob/main/CHANGELOG.md"
Documentation = "https://github.com/gianlucamazza/mangouse/blob/main/docs/README.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/mangouse/__init__.py"

[dependency-groups]
dev = ["ruff", "pytest", "ty"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PT"]
# Existing tests assert MangouseError.code in except; OSError is the
# protocol-layer contract. Do not churn them into pytest.raises().
ignore = ["PT011", "PT017", "PT018"]

[tool.ruff.lint.isort]
known-first-party = ["mangouse"]

[tool.ty.src]
include = ["src"]

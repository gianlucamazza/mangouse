[project]
name = "mangouse"
description = "Compositor-agnostic Wayland seat adapter for coding agents."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gianluca Mazza", email = "info@gianlucamazza.it" }]
keywords = ["wayland", "mcp", "computer-use", "seat"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.13",
  "Topic :: Desktop Environment",
]
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2"]

[project.scripts]
mangouse = "mangouse.hosts.cli:main"
mangouse-mcp = "mangouse.hosts.mcp:main"

[project.urls]
Homepage = "https://github.com/gianlucamazza/mangouse"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/mangouse/__init__.py"

[dependency-groups]
dev = ["ruff", "pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

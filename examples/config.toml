# Copy to ~/.config/mangouse/config.toml if you want to override defaults.
backend = "auto"
# Seat grant: type/click/focus. Default false. Requires a human decision.
allow_input = false
# Clipboard often holds secrets. Off until a human opts in.
allow_clipboard = false
# DevTools Protocol HTTP origin. Empty = discover DevToolsActivePort, else seat only.
devtools_url = ""

[policy]
deny_app_ids = []
confine_groups = []
confine_app_ids = []
